# Dependabot configuration:
# https://docs.github.com/en/free-pro-team@latest/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/gradle/standard_jetbrains_plugin/"
    schedule:
      interval: "daily"
    reviewers:
      - ChrisCarini
    ignore:
      # `org.mockito:mockito-core` & `org.testng:testng` are declared in the
      # `buildSrc/src/main/kotlin/build-standard-jetbrains-plugin-build.gradle.kts`
      # precompiled script plugin. Dependabot's Gradle updater cannot write
      # updates back to dependencies declared in precompiled script plugins
      # (see https://github.com/dependabot/dependabot-core/issues/3288), which
      # causes every update job to fail with `dependency_file_not_resolvable`.
      # Ignore these until upstream support exists (or the dependencies are
      # moved to a build file Dependabot can update).
      - dependency-name: "org.mockito:mockito-core"
      - dependency-name: "org.testng:testng"

  # Maintain dependencies for GitHub Actions (for **this** repo's workflow files & **other** repos' workflow files)
  - package-ecosystem: "github-actions"
    directories:
      - "/github/workflows/" # Maintain dependencies for GitHub Actions (for **other** repos' workflow files)
      - "/"                  # Maintain dependencies for GitHub Actions (for **this** repo's workflow files)
    schedule:
      interval: "daily"
    reviewers:
      - ChrisCarini
